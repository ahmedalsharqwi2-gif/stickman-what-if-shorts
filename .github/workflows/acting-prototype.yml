name: Acting animation prototype
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python acting_demo.py --seconds 60 --fps 24 --output out/acting-demo.mp4
      - run: ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 out/acting-demo.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: stickman-acting-prototype
          path: out/acting-demo.mp4
          retention-days: 7
