{
  "name": "Aftrad Keda fresh narrated review (never publishes)",
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "stickman-candidate-v2-review",
    "cancel-in-progress": false
  },
  "jobs": {
    "review": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
        "GEMINI_TTS_API_KEY": "${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}",
        "GITHUB_TOKEN": "${{ github.token }}",
        "PYTHONUNBUFFERED": "1",
        "CANDIDATE_RUN": "${{ github.run_id }}-${{ github.run_attempt }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "name": "Require explicit review-only launch",
          "run": "python -c \"import json; d=json.load(open('.github/production-v2-launch.json')); assert d['profile']=='stickman' and d['review_only'] is True and d['no_social_posts'] is True\""
        },
        {
          "name": "Retain actual review start evidence",
          "run": "python -m production_v2.export_review --profile stickman --run-dir \".candidate-v2/run-$CANDIDATE_RUN\" --stage started"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Check existing fifth-repository narration secret without printing it",
          "run": "python -c \"import os; assert os.getenv('GEMINI_TTS_API_KEY') or os.getenv('GEMINI_API_KEY'), 'The fifth repository Gemini TTS secret is missing'\""
        },
        {
          "name": "Install free local rendering and measured-ASR dependencies",
          "run": "sudo apt-get update -qq\nsudo apt-get install -y ffmpeg libraqm0\npython -m pip install -r requirements.txt numpy faster-whisper==1.2.1 requests\n"
        },
        {
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": ".voice_cache\nstate/api_budget.sqlite3\n~/.cache/huggingface\n",
            "key": "stickman-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "stickman-v2-${{ github.repository_id }}-"
          }
        },
        {
          "run": "python -m pytest -q tests/test_fresh_review.py tests/test_candidate.py tests/test_factory.py"
        },
        {
          "name": "Generate one reserved original Charon film and measured Arabic captions",
          "run": "python -m stickman.fresh_review --run-dir .candidate-v2/run-${{ github.run_id }}-${{ github.run_attempt }} --ledger .candidate-v2/shared.sqlite3 --git-state"
        },
        {
          "uses": "actions/cache/save@v4",
          "if": "always()",
          "with": {
            "path": ".voice_cache\nstate/api_budget.sqlite3\n~/.cache/huggingface\n",
            "key": "stickman-v2-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "aftrad-keda-fresh-review-${{ github.run_id }}",
            "path": ".candidate-v2/run-*/output/candidate-review.mp4\n.candidate-v2/run-*/output/candidate-verification.json\n.candidate-v2/run-*/generation-*.json\n.candidate-v2/run-*/professional_motion/delivery/*.json\n",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Retain final review status and actual Release media",
          "if": "always()",
          "env": {
            "JOB_STATUS": "${{ job.status }}"
          },
          "run": "python -m production_v2.export_review --profile stickman --run-dir \".candidate-v2/run-$CANDIDATE_RUN\" --stage \"$JOB_STATUS\""
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": null,
    "push": {
      "branches": [
        "codex/rebuild-production-v2"
      ],
      "paths": [
        ".github/production-v2-launch.json"
      ]
    }
  }
}
