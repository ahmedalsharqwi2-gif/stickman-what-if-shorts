{
  "name": "Quality checks — Python, scene engines and Remotion",
  "on": {
    "push": {
      "paths": [
        ".github/workflows/checks.yml",
        "config/remotion_*.json",
        "remotion_factory/**",
        "remotion_motion/**",
        "voice_provider/**"
      ]
    },
    "pull_request": {
      "paths": [
        ".github/workflows/checks.yml",
        "config/remotion_*.json",
        "remotion_factory/**",
        "remotion_motion/**",
        "voice_provider/**"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "quality-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "remotion": {
      "name": "Remotion production regressions",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24"
          }
        },
        {
          "run": "python -m pip install requests beautifulsoup4 numpy Pillow pytest pyyaml"
        },
        {
          "run": "python -m unittest discover -s remotion_factory/tests -q"
        },
        {
          "run": "npm ci --no-audit --no-fund\nnpm run check",
          "working-directory": "remotion_motion"
        }
      ]
    }
  }
}
